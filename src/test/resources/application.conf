include file("defaults.properties")

ktor {
  environment = local
}

application {
  profile = LOCAL
  appName = "sokos-ske-krav"
  appName = ${?NAIS_APP_NAME}
  namespace = "okonomi"
  useAuthentication = false
  basicUsername = ${?BASIC_AUTH_USERNAME}
  basicPassword = ${?BASIC_AUTH_PASSWORD}
}

azure {
  jwksUri = ${?AZURE_OPENID_CONFIG_JWKS_URI}
  configIssuer = ${?AZURE_OPENID_CONFIG_ISSUER}
  clientId = ${?AZURE_APP_CLIENT_ID}
}

sftp {
  host = "10.183.32.98"
  port = 22
  username = ${SKE_SFTP_USERNAME}
  privateKeyPassword = ${SKE_SFTP_PASSWORD}
  privateKeyFilePath = "privateKey"
}

ske {
  skeRestUrl = "https://innkrevingsoppdrag.innkreving.skatteetaten-test.no/api/innkreving/innkrevingsoppdrag/v1/"
}

maskinportenClient {
  clientId = ${MASKINPORTEN_CLIENT_ID}
  wellKnownUrl = ${MASKINPORTEN_WELL_KNOWN_URL}
  rsaKeyString = ${MASKINPORTEN_CLIENT_JWK}
  scopes = ${MASKINPORTEN_SCOPES}
}

postgres {
  host = "localhost"
  port = "5432"
  name = "sokos-ske-krav"
  username = ${DB_USER}
  password = ""
  url = "jdbc:postgresql://localhost:5432/sokos-ske-krav?user=${DB_USER}"
}

slack {
  url = ${SOKOS_SKE_KRAV_SLACK_WEBHOOK_URL}
  slackIdProductLeader = ${SOKOS_SKE_KRAV_SLACKID_PRODUCTLEADER}
  slackIdDomainSpecialists = ${SOKOS_SKE_KRAV_SLACKID_DOMAINSPECIALISTS}
  slackIdTechnicalSpecialist = ${SOKOS_SKE_KRAV_SLACKID_TECHNICALSPECIALIST}
}

circuitBreaker {
  waitDurationInOpenState = 2
}

timer {
  useTimer = true
  schedulerIntervalPeriodInt = 4
}

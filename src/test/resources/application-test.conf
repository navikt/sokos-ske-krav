ktor {
  environment = test
}

application {
  profile = TEST
  appName = "sokos-ske-krav"
  namespace = "okonomi"
  useAuthentication = false
  basicUsername = ${?BASIC_USERNAME}
  basicPassword = ${?BASIC_PASSWORD}
}


maskinportenClient {
  clientId = ${?TEST_MASKINPORTEN_CLIENT_ID}
  wellKnownUrl = ${?TEST_MASKINPORTEN_WELL_KNOWN_URL}
  rsaKeyString = ${?TEST_MASKINPORTEN_CLIENT_JWK}
  scopes = ${?TEST_MASKINPORTEN_SCOPES}
}

ske {
  skeRestUrl = "ske_rest_url"
}

#test sftp is defined in SftpListener

postgres {
  host = "dev-pg.intern.nav.no"
  port = "5432"
  name = "sokos-ske-krav"
  username = ${?TEST_POSTGRES_USERNAME}
  password = ${?TEST_POSTGRES_PASSWORD}
  vaultMountPath = ""
}

slack {
  url = "sokos_ske_krav_slack_webhook_url"
}

circuitBreaker {
  waitDurationInOpenState = 50
}

timer {
  useTimer = false
  schedulerIntervalPeriodInt = 4
}

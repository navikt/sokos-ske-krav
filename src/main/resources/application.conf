include file("defaults.properties")

ktor {
  environment = local
}

application {
  appName = "sokos-ske-krav"
  appName = ${?NAIS_APP_NAME}
  namespace = "okonomi"
  useAuthentication = true
  basicUsername = ${?BASIC_AUTH_USERNAME}
  basicPassword = ${?BASIC_AUTH_PASSWORD}
}


sftp {
  username = ${SKE_SFTP_USERNAME}
  privateKeyPassword = ${SKE_SFTP_PASSWORD}
}

maskinportenClient {
  clientId = ${MASKINPORTEN_CLIENT_ID}
  wellKnownUrl = ${MASKINPORTEN_WELL_KNOWN_URL}
  rsaKeyString = ${MASKINPORTEN_CLIENT_JWK}
  scopes = ${MASKINPORTEN_SCOPES}
}

postgres {
  name = "sokos-ske-krav"
  username = ${?POSTGRES_USERNAME}
  password = ${?POSTGRES_PASSWORD}
}

slack {
  url = ${SOKOS_SKE_KRAV_SLACK_WEBHOOK_URL}
}

timer {
  useTimer = true
  schedulerIntervalPeriodInt = 4
}

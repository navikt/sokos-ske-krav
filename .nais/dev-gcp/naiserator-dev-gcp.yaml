apiVersion: "nais.io/v1alpha1"
kind: "Application"
metadata:
  name: sokos-ske-krav
  namespace: okonomi
  labels:
    team: okonomi
spec:
  image: {{image}}
  port: 8080
  replicas:
    min: 1
    max: 1
  gcp:
    sqlInstances:
      - type: POSTGRES_18
        diskAutoresize: true
        pointInTimeRecovery: true
        tier: db-f1-micro
        databases:
          - name: sokos-ske-krav
            envVarPrefix: DB
  resources:
    limits:
      memory: 4096Mi
    requests:
      cpu: 100m
      memory: 512Mi
  observability:
    autoInstrumentation:
      enabled: true
      runtime: java
  liveness:
    path: /internal/isAlive
    initialDelay: 10
    timeout: 5
    periodSeconds: 5
    failureThreshold: 30
  readiness:
    path: /internal/isReady
    initialDelay: 10
    periodSeconds: 5
    timeout: 5
  prometheus:
    enabled: true
    path: /internal/metrics
  filesFrom:
    - secret: sokos-ske-krav-sftp-private-key
      mountPath: /var/run/secrets/sokos-ske-krav-sftp-private-key
  envFrom:
    - secret: sokos-ske-krav-secrets
  ingresses:
    - https://sokos-ske-krav.intern.dev.nav.no
  accessPolicy:
    outbound:
      external:
        - host: b27drvl011.preprod.local
          ports:
            - port: 22
      rules:
        - application: logging
          namespace: nais-system
    inbound:
      rules:
        - application: azure-token-generator
          namespace: nais
  maskinporten:
    enabled: true
    scopes:
      consumes:
        - name: skatteetaten:innkrevingsoppdrag

name: Deploy application manually

on:
  workflow_dispatch:
    inputs:
      deployment:
        description: "What to deploy"
        required: true
        type: choice
        options:
          - application
          - unleash
        default: application
      environment:
        description: "Environment to deploy to"
        required: true
        type: choice
        options:
          - dev

env:
  TZ: Europe/Oslo

jobs:
  build-and-test:
    if: ${{ inputs.deployment == 'application' }}
    permissions:
      contents: read
    name: Build and test
    uses: navikt/mob-gha-workflows/.github/workflows/gradle-build-test-app.yaml@9f663f4e1ff4f85a52efa067fbf53c5a6bbaede9 # ratchet:navikt/mob-gha-workflows/.github/workflows/gradle-build-test-app.yaml@v1.1.2
    with:
      upload-artifact: true

  build-push-image-dev:
    if: ${{ inputs.deployment == 'application' }}
    permissions:
      contents: read
      id-token: write
    needs: [build-and-test]
    name: Build push dev-gcp image
    uses: navikt/mob-gha-workflows/.github/workflows/gradle-build-push-image.yaml@9f663f4e1ff4f85a52efa067fbf53c5a6bbaede9 # ratchet:navikt/mob-gha-workflows/.github/workflows/gradle-build-push-image.yaml@v1.1.2
    secrets: inherit
    with:
      image-suffix: "dev"
      image-tag: 'snapshot'
      dockerfile: "./.nais/dev/Dockerfile"
      use-artifact: true

  deploy-dev:
    if: ${{ inputs.deployment == 'application' }}
    permissions:
      contents: read
      id-token: write
      pull-requests: write
      deployments: write
    needs: [ build-push-image-dev ]
    name: Deploy to dev-gcp
    uses: navikt/mob-gha-workflows/.github/workflows/nais-deploy.yaml@9f663f4e1ff4f85a52efa067fbf53c5a6bbaede9 # ratchet:navikt/mob-gha-workflows/.github/workflows/nais-deploy.yaml@v1.1.2
    with:
      cluster: dev-gcp
      resource: .nais/dev/naiserator-dev.yaml
      image: ${{ needs.build-push-image-dev.outputs.image }}

  deploy-unleash-dev:
    if: ${{ inputs.deployment == 'unleash' && inputs.environment == 'dev' }}
    permissions:
      id-token: write
      contents: read
    name: Deploy Unleash to dev-gcp
    uses: navikt/mob-gha-workflows/.github/workflows/unleash-deploy.yaml@4e30b004e60632c052461b9ce66a0d802d580f89
    with:
      cluster: dev-gcp
      resource: .nais/dev/unleash-dev.yaml
